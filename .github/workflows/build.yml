name: Compila firmware SmallTV Ultra

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Installa PlatformIO
        run: pip install platformio

      - name: Compila
        run: pio run

      - name: Prepara il .bin
        run: cp .pio/build/smalltv_ultra/firmware.bin smalltv-ultra-firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: smalltv-ultra-firmware
          path: smalltv-ultra-firmware.bin
