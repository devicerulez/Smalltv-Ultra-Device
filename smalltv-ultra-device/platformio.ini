; SmallTV Ultra - orologio + meteo
; Build:  pio run        ->  .pio/build/smalltv_ultra/firmware.bin

[env:smalltv_ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    ; --- TFT_eSPI configurato direttamente qui (nessun User_Setup da modificare) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; --- Retroilluminazione (GPIO5). Se lo schermo resta nero metti 0 qui sotto ---
    -DBL_PIN=5
    -DBL_ACTIVE_LOW=1
